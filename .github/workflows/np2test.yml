# SPDX-License-Identifier: BSD-2-Clause

name: NP2TEST fixture CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  np2test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm=2.16.01-1build1

      - name: Verify toolchain
        run: |
          python3 --version
          python3 - <<'PY'
          import platform
          import sys

          if platform.python_implementation() != "CPython" or sys.version_info[:2] != (3, 12):
              raise SystemExit(f"expected CPython 3.12, got {platform.python_implementation()} {sys.version}")
          PY
          nasm -v
          test "$(nasm -v)" = "NASM version 2.16.01"

      - name: Run NP2TEST CI
        env:
          LC_ALL: C
          TZ: UTC
        run: make -C tests/guest/np2test ci-check

  ubuntu-native-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify host toolchain
        run: |
          command -v cc
          command -v make
          command -v nm
          command -v python3
          cc --version
          make --version
          nm --version
          python3 --version
          python3 - <<'PY'
          import platform
          import sys

          if platform.python_implementation() != "CPython" or sys.version_info[:2] != (3, 12):
              raise SystemExit(f"expected CPython 3.12, got {platform.python_implementation()} {sys.version}")
          PY

      - name: Test result-v1 parser
        run: make -C host test-result-v1-parser

      - name: Test execution controller
        run: make -C host test-execution-controller

      - name: Run Ubuntu-native headless NP2TEST
        run: make -C host test-headless-runner-np2test

  ubuntu-native-video-golden:
    name: Ubuntu-native video golden
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm=2.16.01-1build1

      - name: Verify video toolchain
        run: |
          command -v cc
          command -v make
          command -v nm
          command -v python3
          command -v nasm
          cc --version
          make --version
          nm --version
          python3 --version
          nasm -v
          test "$(nasm -v)" = "NASM version 2.16.01"
          python3 - <<'PY'
          import platform
          import sys

          if platform.python_implementation() != "CPython" or sys.version_info[:2] != (3, 12):
              raise SystemExit(f"expected CPython 3.12, got {platform.python_implementation()} {sys.version}")
          PY

      - name: Test deterministic np2video fixture
        run: make -C tests/guest/np2video syntax-check test reproducibility-check

      - name: Test deterministic direct-VRAM graphics fixture
        run: make -C tests/guest/np2video-gfx-vram syntax-check test reproducibility-check

      - name: Test np2video golden checker
        run: make -C host test-video-golden-checker

      - name: Test video golden support infrastructure
        run: |
          make -C host \
            test-crc32 \
            test-headless-scrnmng \
            test-headless-scrnmng-snapshot \
            test-headless-scrnmng-bmp \
            test-video-control-v1 \
            test-sha256 \
            test-video-runner-cli

      - name: Run approved np2video golden regression
        run: make -C host test-video-runner-golden

      - name: Run approved direct-VRAM graphics golden regression
        run: make -C host test-video-gfx-vram-golden

  # NON-FORMAL supplementary firmware evidence only. The native job above is
  # the formal EXTMEM=13 Stage-1 oracle; this job uses explicit EXTMEM=8 because
  # esp-emu v0.39.0 exposes 16 MiB PSRAM but cannot provide the formal
  # configuration's required contiguous external allocation.
  esp32p4-esp-emu-reduced:
    name: NON-FORMAL ESP32-P4 esp-emu reduced Stage-1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision pinned ESP-IDF and esp-emu
        run: |
          set -euo pipefail
          source tools/versions.env

          readonly idf_root="${RUNNER_TEMP}/esp-idf-${ESP_IDF_VERSION}"
          readonly idf_commit="735507283d5b2f9fb363a1901172dbd9e847945d"
          readonly emu_bin_dir="${RUNNER_TEMP}/esp-emu-${ESP_EMU_VERSION}/bin"
          readonly emu_installer="${RUNNER_TEMP}/esp-emu-install.sh"
          readonly emu_installer_sha256="7d116867e9a54b8ab90b12fffec93eb5782b3b01f74191078be5278fa6fd5688"

          git clone --depth 1 --branch "${ESP_IDF_VERSION}" --recursive \
            https://github.com/espressif/esp-idf.git "${idf_root}"
          test "$(git -C "${idf_root}" rev-parse HEAD)" = "${idf_commit}"
          "${idf_root}/install.sh" esp32p4
          # Keep the environment active for the authoritative test invocation
          # below; the test helper also accepts an already-active environment.
          source "${idf_root}/export.sh"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"

          curl -fsSL \
            "https://raw.githubusercontent.com/espressif/esp-emulator/60511395403787e243e45749e4f8bc2972b4d7c1/install.sh" \
            -o "${emu_installer}"
          printf '%s  %s\n' "${emu_installer_sha256}" "${emu_installer}" | sha256sum -c -
          sh "${emu_installer}" \
            --version "${ESP_EMU_VERSION}" \
            --bin-dir "${emu_bin_dir}"
          export ESP_EMU="${emu_bin_dir}/esp-emu"
          test "$(${ESP_EMU} --version 2>&1 | sed -n '/^esp-emu /{p;q;}')" = \
            "esp-emu 0.39.0"

      - name: Run NON-FORMAL reduced firmware validation
        run: |
          set -euo pipefail
          source tools/versions.env
          readonly idf_root="${RUNNER_TEMP}/esp-idf-${ESP_IDF_VERSION}"
          readonly emu_bin="${RUNNER_TEMP}/esp-emu-${ESP_EMU_VERSION}/bin/esp-emu"
          source "${idf_root}/export.sh"
          export ESP_EMU="${emu_bin}"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"
          test "$(${ESP_EMU} --version 2>&1 | sed -n '/^esp-emu /{p;q;}')" = \
            "esp-emu 0.39.0"
          bash tools/emu/test-np2-stage1-reduced.sh

      - name: Run Step 6A bounded storage validation
        run: |
          set -euo pipefail
          source tools/versions.env
          readonly idf_root="${RUNNER_TEMP}/esp-idf-${ESP_IDF_VERSION}"
          readonly emu_bin="${RUNNER_TEMP}/esp-emu-${ESP_EMU_VERSION}/bin/esp-emu"
          source "${idf_root}/export.sh"
          export ESP_EMU="${emu_bin}"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"
          test "$(${ESP_EMU} --version 2>&1 | sed -n '/^esp-emu /{p;q;}')" = \
            "esp-emu 0.39.0"
          bash tools/emu/test-step6a-ci.sh

  esp32p4-esp-emu-video-golden:
    name: ESP32-P4 esp-emu video golden
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm=2.16.01-1build1

      - name: Verify video toolchain
        run: |
          command -v cc
          command -v make
          command -v python3
          command -v nasm
          cc --version
          make --version
          python3 --version
          nasm -v
          test "$(nasm -v)" = "NASM version 2.16.01"
          python3 - <<'PY'
          import platform
          import sys

          if platform.python_implementation() != "CPython" or sys.version_info[:2] != (3, 12):
              raise SystemExit(f"expected CPython 3.12, got {platform.python_implementation()} {sys.version}")
          PY

      - name: Provision pinned ESP-IDF and esp-emu
        run: |
          set -euo pipefail
          source tools/versions.env

          readonly idf_root="${RUNNER_TEMP}/esp-idf-${ESP_IDF_VERSION}"
          readonly idf_commit="735507283d5b2f9fb363a1901172dbd9e847945d"
          readonly emu_bin_dir="${RUNNER_TEMP}/esp-emu-${ESP_EMU_VERSION}/bin"
          readonly emu_installer="${RUNNER_TEMP}/esp-emu-install.sh"
          readonly emu_installer_sha256="7d116867e9a54b8ab90b12fffec93eb5782b3b01f74191078be5278fa6fd5688"

          git clone --depth 1 --branch "${ESP_IDF_VERSION}" --recursive \
            https://github.com/espressif/esp-idf.git "${idf_root}"
          test "$(git -C "${idf_root}" rev-parse HEAD)" = "${idf_commit}"
          "${idf_root}/install.sh" esp32p4
          source "${idf_root}/export.sh"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"

          curl -fsSL \
            "https://raw.githubusercontent.com/espressif/esp-emulator/60511395403787e243e45749e4f8bc2972b4d7c1/install.sh" \
            -o "${emu_installer}"
          printf '%s  %s\n' "${emu_installer_sha256}" "${emu_installer}" | sha256sum -c -
          sh "${emu_installer}" \
            --version "${ESP_EMU_VERSION}" \
            --bin-dir "${emu_bin_dir}"
          export ESP_EMU="${emu_bin_dir}/esp-emu"
          test "$(${ESP_EMU} --version 2>&1 | sed -n '/^esp-emu /{p;q;}')" = \
            "esp-emu 0.39.0"

      - name: Test ESP video golden support infrastructure
        run: make -C host test-video-golden-header test-video-golden-log

      - name: Run ESP32-P4 esp-emu video golden
        run: |
          set -euo pipefail
          source tools/versions.env
          readonly idf_root="${RUNNER_TEMP}/esp-idf-${ESP_IDF_VERSION}"
          readonly emu_bin="${RUNNER_TEMP}/esp-emu-${ESP_EMU_VERSION}/bin/esp-emu"
          source "${idf_root}/export.sh"
          export ESP_EMU="${emu_bin}"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"
          test "$(${ESP_EMU} --version 2>&1 | sed -n '/^esp-emu /{p;q;}')" = \
            "esp-emu 0.39.0"
          bash tools/emu/test-np2video-golden.sh

      - name: Run ESP32-P4 esp-emu direct-VRAM graphics golden
        run: |
          set -euo pipefail
          source tools/versions.env
          readonly idf_root="${RUNNER_TEMP}/esp-idf-${ESP_IDF_VERSION}"
          readonly emu_bin="${RUNNER_TEMP}/esp-emu-${ESP_EMU_VERSION}/bin/esp-emu"
          source "${idf_root}/export.sh"
          export ESP_EMU="${emu_bin}"
          test "$(idf.py --version)" = "ESP-IDF v5.5.4"
          test "$(${ESP_EMU} --version 2>&1 | sed -n '/^esp-emu /{p;q;}')" = \
            "esp-emu 0.39.0"
          bash tools/emu/test-np2video-golden.sh --fixture gfx-vram
